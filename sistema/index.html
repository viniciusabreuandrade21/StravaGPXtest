<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedais</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5ef;color:#193b35;font-family:system-ui, sans-serif}main{max-width:1000px;margin:auto;padding:48px 24px}small{color:#60746b}h1{font-size:44px;letter-spacing:-2px;margin:8px 0}p{line-height:1.6;color:#60746b}button,a{font:inherit;padding:12px 18px;border-radius:10px;border:1px solid #cad8cc;background:white;color:#235a44;cursor:pointer}a{display:inline-block;background:#235a44;color:white;text-decoration:none;white-space:nowrap}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.hint{background:#e5eddf;border-radius:16px;padding:18px 22px;margin:24px 0}.card{display:flex;align-items:center;justify-content:space-between;gap:24px;background:white;border:1px solid #dce4da;border-radius:18px;padding:24px;margin:14px 0}h2{margin:0 0 6px;font-size:22px;overflow-wrap:anywhere}.file{font-size:12px;overflow-wrap:anywhere}.error{color:#973d28}button:focus-visible,a:focus-visible{outline:3px solid #e7aa40;outline-offset:3px}@media(max-width:600px){header,.card{align-items:flex-start;flex-direction:column}main{padding:24px 16px}h1{font-size:36px}}/* Tema escuro da biblioteca */
:root{color-scheme:dark}body{background:#0d0d0f;color:#f0f0f2}small,p{color:#b5b5bd}.hint{background:#1c1c20;border:1px solid #34343b}.card{background:#19191d;border-color:#34343b}button,a{background:#29292f;border-color:#494951;color:#f0f0f2}button:hover,a:hover{background:#3a3a42}button:disabled{opacity:.5;cursor:wait}.error{color:#ffab96}button:focus-visible,a:focus-visible{outline-color:#d5d5df}
</style>
<main><header><div><small>SUA BIBLIOTECA DE PERCURSOS</small><h1>Meus pedais</h1></div><button id="refresh">Atualizar lista</button></header><p class="hint">Coloque seus arquivos <b>.gpx</b> na pasta <b>GPX</b> e clique em <b>Atualizar lista</b>. Cada pedal tem seu próprio mapa, animação e perfil de altitude.</p><p id="status" role="status">Buscando pedais…</p><section id="rides" aria-label="Seus pedais"></section><p><small>Os arquivos ficam no seu computador. O mapa de ruas precisa de internet.</small></p></main>
<script>const list=document.getElementById('rides'),status=document.getElementById('status'),button=document.getElementById('refresh');async function load(){button.disabled=true;status.textContent='Buscando pedais…';try{const response=await fetch('/api/pedais');if(!response.ok)throw Error();const rides=await response.json();list.replaceChildren();for(const ride of rides){const card=document.createElement('article');card.className='card';const info=document.createElement('div'),title=document.createElement('h2'),meta=document.createElement('p'),file=document.createElement('small');title.textContent=ride.name;file.textContent=ride.file;file.className='file';meta.textContent=ride.error?'Não foi possível ler este GPX: '+ride.error:ride.date+' · '+ride.distance.toLocaleString('pt-BR',{maximumFractionDigits:2})+' km · '+ride.duration;if(ride.error)meta.className='error';info.append(title,meta,file);card.append(info);if(!ride.error){const link=document.createElement('a');link.href='/mapa/'+ride.id;link.textContent='Abrir mapa';card.append(link)}list.append(card)}status.textContent=rides.length?rides.length+' arquivo(s) na sua biblioteca.':'Ainda não há pedais. Coloque um arquivo na pasta GPX para começar.'}catch{status.textContent='Não foi possível acessar a biblioteca. Abra “Abrir meus pedais.cmd” e tente novamente.'}finally{button.disabled=false}}button.onclick=load;load();</script></html>
